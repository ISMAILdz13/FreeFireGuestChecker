name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements_dev.txt

    - name: Run linting
      run: |
        pip install flake8 black isort
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run type checking
      run: |
        pip install mypy
        mypy . --ignore-missing-imports --disallow-untyped-defs --disallow-incomplete-defs

    - name: Run tests
      run: |
        python -m pytest tests/ -v --tb=short

    - name: Upload test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: test-results
        path: |
          test-results/
          .pytest_cache/

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to DockerHub
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}

    - name: Build and push
      uses: docker/build-push-action@v4
      with:
        context: .
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ismaildz13/freefire-guest-checker:latest
          ismaildz13/freefire-guest-checker:${{ github.sha }}
        labels: |
          org.opencontainers.image.title=FreeFire Guest Checker
          org.opencontainers.image.description=Free Fire Guest Account Checker
          org.opencontainers.image.url=https://github.com/ISMAILdz13/FreeFireGuestChecker
          org.opencontainers.image.source=https://github.com/ISMAILdz13/FreeFireGuestChecker
          org.opencontainers.image.version=2.0.0
          org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          org.opencontainers.image.revision=${{ github.sha }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SSH_PORT || 22 }}
        script: |
          cd /opt/freefire-guest-checker
          git pull origin main
          docker-compose down
          docker-compose up -d --build
          docker system prune -f

  notify:
    name: Notify on Success/Failure
    runs-on: ubuntu-latest
    needs: [test, build, deploy]
    if: always()

    steps:
    - name: Send Telegram Notification
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_TO }}
        token: ${{ secrets.TELEGRAM_TOKEN }}
        message: |
          ${{ github.workflow }} ${{ github.event_name == 'push' && 'Push' || 'Pull Request' }} by ${{ github.actor }}
          
          ${{ needs.test.result == 'success' && '✅ Tests Passed' || '❌ Tests Failed' }}
          ${{ needs.build.result == 'success' && '✅ Build Successful' || '❌ Build Failed' }}
          ${{ needs.deploy.result == 'success' && '✅ Deployed' || (needs.deploy.result == 'skipped' && '⏭️ Deploy Skipped' || '❌ Deploy Failed') }}
          
          Repository: ${{ github.repository }}
          Commit: ${{ github.sha }}
          Link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
