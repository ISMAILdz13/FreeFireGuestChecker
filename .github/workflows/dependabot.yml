name: Dependabot

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  dependabot:
    name: Dependabot
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Check for dependency updates
      run: |
        pip install pip-review
        pip-review --auto-pull-request --github-token ${{ secrets.GITHUB_TOKEN }}
