version: '3.8'

services:
  app:
    build: .
    container_name: freefire-guest-checker
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./config:/app/config
      - ./static:/app/static
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - DATABASE_PATH=/app/data/accounts.db
      - LOG_LEVEL=INFO
      - MAX_WORKERS=10
      - RATE_LIMIT=100
      - PROXY_ENABLED=false
    networks:
      - freefire-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: freefire-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - freefire-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    container_name: freefire-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html/static:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - freefire-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: freefire-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - freefire-network

  grafana:
    image: grafana/grafana:latest
    container_name: freefire-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
    networks:
      - freefire-network

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile.telegram
    container_name: freefire-telegram-bot
    restart: unless-stopped
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - BOT_ADMIN_ID=${BOT_ADMIN_ID}
      - API_URL=http://app:5000
    depends_on:
      - app
    networks:
      - freefire-network

  discord-bot:
    build:
      context: .
      dockerfile: Dockerfile.discord
    container_name: freefire-discord-bot
    restart: unless-stopped
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GUILD_ID=${DISCORD_GUILD_ID}
      - API_URL=http://app:5000
    depends_on:
      - app
    networks:
      - freefire-network

networks:
  freefire-network:
    driver: bridge

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
